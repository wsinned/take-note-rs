[package]
name = "take-note"
version = "2.0.7"
edition = "2024"
authors = ["Dennis Woodruff <denniswoodruffuk@gmail.com>"]
description = "A CLI for creating and managing weekly and daily markdown notes"
license = "MIT"
repository = "https://github.com/wsinned/take-note-rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"
thiserror = "2.0"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
strip = true
