name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  COCOGITTO_VERSION: 7.0.0
  CARGO_EDIT_VERSION: 0.13.11

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Conventional commit check
        uses: wagoid/commitlint-github-action@v6
        with:
          failOnWarnings: true

  bump-version:
    name: Bump Version
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache release tools
        id: release-tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cog
            ~/.cargo/bin/cargo-set-version
          key: release-tools-${{ runner.os }}-cog-${{ env.COCOGITTO_VERSION }}-cargo-edit-${{ env.CARGO_EDIT_VERSION }}

      - name: Install release tools
        if: steps.release-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cocogitto --version "$COCOGITTO_VERSION" --locked
          cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          cog bump --auto
          NEW_VERSION=$(cog get-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION"

      - name: Push version bump and tag
        env:
          TAG: v${{ steps.bump.outputs.new_version }}
        run: git push --atomic origin main "$TAG"

  build:
    name: Build
    needs: bump-version
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: take-note_linux_x86_64
            binary_name: take-note
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: take-note_linux_aarch64
            binary_name: take-note
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: take-note_darwin_x86_64
            binary_name: take-note
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: take-note_darwin_aarch64
            binary_name: take-note
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: take-note_windows_x86_64.exe
            binary_name: take-note.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.bump-version.outputs.new_version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify package version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          actual_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "take-note") | .version')
          test "$actual_version" = "$EXPECTED_VERSION"

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename release binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: [build, bump-version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.bump-version.outputs.new_version }}
          name: Release v${{ needs.bump-version.outputs.new_version }}
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.bump-version.outputs.new_version }}
        run: |
          expected_assets=$(printf '%s\n' \
            take-note_darwin_aarch64 \
            take-note_darwin_x86_64 \
            take-note_linux_aarch64 \
            take-note_linux_x86_64 \
            take-note_windows_x86_64.exe)
          actual_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)

          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Expected assets:"
            echo "$expected_assets"
            echo "Actual assets:"
            echo "$actual_assets"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.bump-version.outputs.new_version }}
        run: gh release edit "$TAG" --draft=false --latest
